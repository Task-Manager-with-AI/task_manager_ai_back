services:
  - type: web
    name: task-manager-ai-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: AI_PROVIDER
        value: deepseek
      - key: TRANSCRIPTION_PROVIDER
        value: groq
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_LLM_MODEL
        value: deepseek-chat
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: WHISPER_PRELOAD_ON_STARTUP
        value: "false"
      - key: DEFAULT_LANGUAGE
        value: es
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
