services:
  - type: web
    name: task-manager-ai-back
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: AI_PROVIDER
        value: deepseek
      - key: TRANSCRIPTION_PROVIDER
        value: groq
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_LLM_MODEL
        value: deepseek-chat
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: WHISPER_PRELOAD_ON_STARTUP
        value: "false"
      - key: DEFAULT_LANGUAGE
        value: es
      # RAG Copilot — local embeddings (demo; no OpenAI quota needed)
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_DIM
        value: "384"
      - key: LOCAL_EMBEDDING_MODEL
        value: paraphrase-multilingual-MiniLM-L12-v2
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: EMBEDDING_PRELOAD_ON_STARTUP
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
